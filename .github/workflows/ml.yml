name: ML CI

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        # The default test run imports pandas, pyarrow, PyYAML, SciPy and PyMC-Marketing, which live in the train group.
        run: uv sync --locked --group train

      - name: Run tests
        # Explicit group, so a change to uv's default groups cannot drop causalml or PyMC-Marketing from the run.
        run: uv run --group train pytest

      - name: Regenerate the contract and require no diff
        # The schemas and samples are committed; a Pydantic change without regeneration fails here.
        run: |
          uv run --group train python scripts/generate_contracts.py
          git diff --exit-code -- contracts

  serve-image:
    name: Serving image builds with the serve group
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the serving image
        # The image installs the serve group alone; a serving import that needs a training package fails here.
        run: docker build --file ml/Dockerfile.serve --tag parley-ml-serve:ci ml
