services:
  db:
    image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.1@sha256:d3ed5afb812d4fcacf14e88d1bc70eb2102d4729c5e032c8b4ec21afe4352a07
    environment:
      DOTNET_RESMON__IS_GET_ULIMIT_SUPPORTED: "false"

  redis:
    profiles:
      - redis
    image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}"]
    volumes:
      - valkey-data:/data

  # Scoring service (profile `ml`). Internal network for service-to-service calls. Artifacts are mounted read-only;
  # no training data is mounted. The key is required: the service and this file have no fallback. Local development
  # publishes the port and sets the key in docker-compose.override.yml (see docker-compose.override.example.yml).
  ml:
    profiles:
      - ml
    build:
      context: ./ml
      dockerfile: Dockerfile.serve
    environment:
      PARLEY_ML_KEY: ${PARLEY_ML_KEY:?Set PARLEY_ML_KEY in .env or the environment}
      PARLEY_ML_ARTIFACTS_DIR: /artifacts/models
    volumes:
      - ./ml/artifacts/models:/artifacts/models:ro
    networks:
      - ml-internal
      - ml-edge
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  # Profile `app` is reserved for the deployment containers (API + web). The
  # API and frontend run on the host in development.

networks:
  ml-internal:
    internal: true
  ml-edge: {}

volumes:
  pgdata:
  valkey-data:
