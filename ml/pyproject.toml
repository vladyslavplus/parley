[project]
name = "parley-ml"
version = "0.1.0"
description = "Parley machine learning module: uplift and CLV training plus scoring service"
requires-python = ">=3.12,<3.13"
# Package-level imports: parley_ml needs these in every environment.
dependencies = [
    "numpy==2.4.6",
    "xgboost==3.4.1",
]

[dependency-groups]
train = [
    "causalml==0.18.0",
    "pymc-marketing==1.3.0",
    "xgboost==3.4.1",
    "numpy==2.4.6",
    "pandas==3.1.1",
    "polars==2.1.0",
    "scikit-learn==1.9.1",
    "fastapi==0.162.2",
]
serve = [
    "fastapi==0.162.2",
    "uvicorn>=0.30",
    "xgboost==3.4.1",
    "numpy==2.4.6",
    "scipy>=1.14",
    "pydantic>=2.9",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parley_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
